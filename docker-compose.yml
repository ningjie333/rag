services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: scaffold-backend
    ports:
      - "3002:3002"
    env_file:
      - ./backend/.env
    volumes:
      - chroma_data:/app/backend/data/chroma_db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: scaffold-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
