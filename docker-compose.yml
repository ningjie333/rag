services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: scaffold-backend
    ports:
      - "3002:3002"
    env_file:
      - ./backend/.env
    volumes:
      - chroma_data:/app/backend/data/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: scaffold-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
